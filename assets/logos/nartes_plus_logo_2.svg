<svg viewBox="0 0 236 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3B Harf Gradyanları (Logo 2 Stüdyo Tasarımı) -->
    <linearGradient id="gradN" x1="0" y1="6" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gradA" x1="0" y1="6" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="gradR" x1="0" y1="6" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="gradT" x1="0" y1="6" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradE" x1="0" y1="6" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="gradS" x1="0" y1="6" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- 3B Eğimli '+' Oyun Küpü Gradyanı -->
    <linearGradient id="cubeBody" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="48%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="plusInner" x1="6" y1="6" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft3d" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="plusGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#A7F3D0" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- 3B Dokunsal N-A-R-T-E-S Harfleri -->
  <g filter="url(#soft3d)" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="31" letter-spacing="0.5">
    <text x="4"   y="35" fill="url(#gradN)">N</text>
    <text x="30"  y="35" fill="url(#gradA)">A</text>
    <text x="56"  y="35" fill="url(#gradR)">R</text>
    <text x="81"  y="35" fill="url(#gradT)">T</text>
    <text x="104" y="35" fill="url(#gradE)">E</text>
    <text x="126" y="35" fill="url(#gradS)">S</text>
  </g>

  <!-- Sondaki T Harfi Yerine Geçen Eğimli 3B '+' Oyun Küpü -->
  <g transform="translate(152, 5) rotate(10 18 18)" filter="url(#soft3d)">
    <!-- 3B Alt Kalınlık Katmanı -->
    <rect x="2" y="3.5" width="34" height="34" rx="9" fill="#064E3B" opacity="0.65"/>
    <!-- Ana Küp Gövdesi -->
    <rect x="1" y="1" width="34" height="34" rx="9" fill="url(#cubeBody)" stroke="#FDE68A" stroke-width="1.3"/>
    <!-- Üst Parlama Şeridi -->
    <path d="M8 4H28C30.5 4 32 5.5 32 7.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
    <!-- Neon Parlayan '+' Sembolü -->
    <g filter="url(#plusGlow)">
      <path d="M18 8.5V27.5M8.5 18H27.5" stroke="#FFFFFF" stroke-width="7.2" stroke-linecap="round"/>
      <path d="M18 8.5V27.5M8.5 18H27.5" stroke="url(#plusInner)" stroke-width="4.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
